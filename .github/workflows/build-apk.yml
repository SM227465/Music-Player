name: Build Android APK with EAS

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build APK with EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: eas build -p android --profile preview --non-interactive --local --output=./melodify.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: melodify-apk
          path: ./melodify.apk
          retention-days: 30

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.date.outputs.date }}
          name: Melodify v${{ steps.date.outputs.date }}
          body: |
            ## Melodify APK Build

            **Build Date:** ${{ steps.date.outputs.date }}
            **Branch:** develop
            **Commit:** ${{ github.sha }}

            ### Download
            Download the APK file below and install it on your Android device.

            ### Installation
            1. Download the APK file
            2. Enable "Install from Unknown Sources" in your Android settings
            3. Open the downloaded APK file to install
          files: ./melodify.apk
          draft: false
          prerelease: true

      - name: Comment on PR with artifact
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ APK build completed! Download the artifact from the Actions run.'
            })
